<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f0f0f0" />
    <!-- iOS home-screen / standalone appearance. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Alex Burtyn" />

    <!-- Apply the saved / preferred theme before first paint (no flash). -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var dark = saved ? saved === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>

    <title>Alex Burtyn — Software Developer</title>
    <meta
      name="description"
      content="Portfolio of Alex Burtyn, a software developer specializing in React, Next.js, Django and Three.js."
    />
    <link rel="canonical" href="https://alexburtyn.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://alexburtyn.com/" />
    <meta property="og:title" content="Alex Burtyn — Software Developer" />
    <meta
      property="og:description"
      content="Portfolio of Alex Burtyn, a software developer specializing in React, Next.js, Django and Three.js."
    />
    <meta property="og:image" content="https://alexburtyn.com/images/1.webp" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Alex Burtyn — Software Developer" />
    <meta
      name="twitter:description"
      content="Portfolio of Alex Burtyn, a software developer specializing in React, Next.js, Django and Three.js."
    />
    <meta name="twitter:image" content="https://alexburtyn.com/images/1.webp" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
